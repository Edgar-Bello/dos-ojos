<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dos Ojos</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f3f5f1; color: #1d2a22; }
  .band { background: #0b5cad; color: #fff; font: 600 13px/1.3 system-ui, sans-serif; padding: 6px 10px; text-align: center; }
  main { max-width: 560px; margin: 0 auto; padding: 18px; }
  h1 { font-size: 23px; margin: 8px 0 10px; }
  p { font-size: 17px; line-height: 1.45; }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0; }
  button, label.button { font-size: 18px; padding: 14px 18px; border-radius: 12px; border: 0; cursor: pointer; }
  label.button { background: #1a7f37; color: #fff; font-weight: 700; }
  button { background: #e2e8e1; color: #1d2a22; }
  button:disabled { opacity: .5; }
  input[type=file] { display: none; }
  .bar { height: 14px; background: #dfe5dd; border-radius: 7px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: #1a7f37; transition: width .2s; }
  .status { font-size: 16px; margin-top: 8px; min-height: 22px; }
  .error { color: #a4400b; }
  .done { font-size: 19px; font-weight: 600; color: #1a7f37; }
</style>
</head>
<body>
<div class="band" id="band" hidden></div>
<main>
  <h1 id="title"></h1>
  <p id="info"></p>
  <div class="buttons">
    <label class="button" id="chooseLabel"><span id="choose"></span><input type="file" id="files" multiple></label>
    <label class="button" id="folderLabel"><span id="folder"></span><input type="file" id="folderFiles" webkitdirectory multiple></label>
    <button id="finish" disabled></button>
  </div>
  <div class="bar"><div id="bar"></div></div>
  <div class="status" id="status"></div>
  <div class="status error" id="error"></div>
</main>
<script>
const DATA = __DATA__;
const S = DATA.strings;
const $ = id => document.getElementById(id);
document.documentElement.lang = DATA.lang;
if (DATA.banner) { $("band").textContent = DATA.banner; $("band").hidden = false; }
$("title").textContent = S.title;
$("info").textContent = S.info;
$("choose").textContent = S.choose;
$("folder").textContent = S.folder;
$("finish").textContent = S.done;
$("files").accept = DATA.extensions.join(",") + ",image/*,video/*";
let uploaded = DATA.files;
$("finish").disabled = !uploaded;
if (DATA.done) showDone(uploaded);

function showDone(n) {
  $("status").className = "status done";
  $("status").textContent = S.finished.replace("{n}", n);
}

// The tunnel in front of the server takes at most 100 MB and about 100 s per
// request, and each connection through it is slow while several together are
// not. So big files go in small pieces, several at a time, and a piece that
// fails is tried again.
const PIECE = 4 * 1024 * 1024;
const AT_ONCE = 5;
const TRIES = 6;
const PIECE_TIMEOUT_MS = 90 * 1000;

async function put(file) {
  if (file.size <= PIECE) return putPiece(file, file, null, loaded => onProgress(loaded));
  const starts = [];
  for (let start = 0; start < file.size; start += PIECE) starts.push(start);
  const moving = new Map();                   // bytes on the way, per piece
  let arrived = 0;
  let result = {};
  const show = () => onProgress(arrived + [...moving.values()].reduce((a, b) => a + b, 0));
  async function worker() {
    while (starts.length) {
      const start = starts.shift();
      const piece = file.slice(start, Math.min(start + PIECE, file.size));
      for (let attempt = 1; ; attempt++) {
        try {
          const answer = await putPiece(file, piece, start, loaded => {
            moving.set(start, loaded); show();
          });
          if (answer.bytes) result = answer;
          break;
        } catch (error) {
          moving.delete(start); show();
          if (attempt >= TRIES) { starts.length = 0; throw error; }
          await new Promise(wait => setTimeout(wait, 3000 * attempt));
        }
      }
      moving.delete(start);
      arrived += piece.size;
      show();
    }
  }
  await Promise.all(Array.from({ length: AT_ONCE }, worker));
  return result;
}

function putPiece(file, body, start, progress) {
  return new Promise((resolve, reject) => {
    const request = new XMLHttpRequest();
    const where = start === null ? "" : `?offset=${start}&total=${file.size}`;
    request.open("PUT", `${location.pathname}/file/${encodeURIComponent(file.name)}${where}`);
    request.upload.onprogress = e => progress(e.loaded);
    request.onload = () => {
      let result = {};
      try { result = JSON.parse(request.responseText); } catch (e) {}
      request.status === 200 ? resolve(result) : reject(new Error(result.error || request.status));
    };
    request.onerror = () => reject(new Error("network"));
    request.timeout = PIECE_TIMEOUT_MS;
    request.ontimeout = () => reject(new Error("too slow"));
    request.send(body);
  });
}

let onProgress = () => {};

async function send(input) {
  // A folder carries whatever else lives in it - readmes, thumbnails, a stray
  // spreadsheet - and the server refuses those one by one; drop them here so a
  // folder of ten thousand files does not stop on the first of them.
  const chosen = [...input.files].filter(f =>
    DATA.extensions.some(ext => f.name.toLowerCase().endsWith(ext)));
  if (!chosen.length) return;
  $("error").textContent = "";
  $("chooseLabel").style.opacity = .5;
  const have = (await (await fetch(`${location.pathname}/files`)).json()).files;
  const todo = chosen.filter(f => have[f.name.replace(/[^A-Za-z0-9._-]/g, "_")] !== f.size);
  const total = chosen.reduce((s, f) => s + f.size, 0);
  let sent = chosen.filter(f => !todo.includes(f)).reduce((s, f) => s + f.size, 0);
  let count = chosen.length - todo.length;
  const show = extra => {
    $("bar").style.width = `${Math.min(100, 100 * (sent + extra) / total)}%`;
    $("status").textContent = S.progress.replace("{done}", count).replace("{total}", chosen.length)
      .replace("{mb}", ((sent + extra) / 1e6).toFixed(0));
  };
  show(0);
  for (const file of todo) {
    onProgress = show;
    try {
      await put(file);
      sent += file.size; count += 1; uploaded += 1;
      $("finish").disabled = false;
      show(0);
    } catch (error) {
      $("error").textContent = S.failed.replace("{name}", file.name).replace("{error}", error.message);
      break;
    }
  }
  $("chooseLabel").style.opacity = 1;
  input.value = "";
}

$("files").onchange = () => send($("files"));
$("folderFiles").onchange = () => send($("folderFiles"));

$("finish").onclick = async () => {
  $("finish").disabled = true;
  const response = await fetch(`${location.pathname}/done`, { method: "POST" });
  const result = await response.json();
  if (result.ok) showDone(result.files);
  else { $("error").textContent = result.error; $("finish").disabled = false; }
};
</script>
</body>
</html>
